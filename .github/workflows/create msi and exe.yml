name: Build Windows (.exe / MSI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Windows MSI
        run: .\gradlew :desktopApp:packageMsi --info
        continue-on-error: true

      - name: Build Windows EXE
        run: .\gradlew :desktopApp:packageExe --info

      - name: Show jpackage error logs on failure
        if: failure()
        run: |
          Get-ChildItem -Path desktopApp/build/compose/logs -Filter *.txt -Recurse | Unregister-ScheduledTask -ErrorAction SilentlyContinue # Solo para evitar ruido
          foreach ($file in Get-ChildItem -Path desktopApp/build/compose/logs -Filter *.txt -Recurse) {
            Write-Host "--- LOG: $($file.FullName) ---"
            Get-Content $file.FullName
          }
        shell: powershell

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-installer
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn
