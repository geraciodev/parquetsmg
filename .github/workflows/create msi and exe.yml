name: Build Windows (.exe / MSI)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Windows MSI
        run: .\gradlew :desktopApp:packageMsi --info
        continue-on-error: true

      - name: Build Windows EXE
        run: .\gradlew :desktopApp:packageExe --info

      - name: Show jpackage error logs on failure
        if: failure()
        shell: powershell
        run: |
          $logDir = "desktopApp/build/compose/logs"
          if (Test-Path $logDir) {
            Get-ChildItem -Path $logDir -Filter *.txt -Recurse | ForEach-Object {
              Write-Host "--- LOG: $($_.FullName) ---"
              Get-Content $_.FullName
            }
          } else {
            Write-Host "No se encontraron logs en $logDir"
          }

      - name: Upload MSI installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-installer
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

      - name: Upload EXE installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
