name: Build Windows (.exe / MSI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Windows package (MSI and EXE)
        # En Windows no es necesario chmod +x gradlew. 
        # Usamos :desktopApp: para ejecutar las tareas del módulo específico.
        run: ./gradlew :desktopApp:packageMsi :desktopApp:packageExe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-installer
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn
