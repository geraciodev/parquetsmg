name: Build Windows (.exe / MSI)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Windows Packages
        # Usamos --continue para que si falla un formato (ej. MSI), intente generar el otro (EXE)
        run: .\gradlew :desktopApp:packageMsi :desktopApp:packageExe --info --continue
        continue-on-error: true

      - name: Show jpackage error logs on failure
        if: always()
        shell: powershell
        run: |
          $logDir = "desktopApp/build/compose/logs"
          if (Test-Path $logDir) {
            Get-ChildItem -Path $logDir -Filter *.txt -Recurse | ForEach-Object {
              Write-Host "--- LOG DE ERROR: $($_.FullName) ---"
              Get-Content $_.FullName
            }
          }

      - name: Upload Artifacts to Actions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-binaries
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        # Se ejecuta solo si es un tag, incluso si el build dio avisos
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
